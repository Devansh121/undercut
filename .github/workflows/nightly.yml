name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Rooms soak: eight clients through the network simulator for a full race.
      # The screenshot-station run lands here as it is written.
      - run: npm run test:soak
        env:
          SOAK_REPORT: soak-report.md
      - name: Soak report
        if: always()
        run: if [ -f soak-report.md ]; then cat soak-report.md >> "$GITHUB_STEP_SUMMARY"; fi
