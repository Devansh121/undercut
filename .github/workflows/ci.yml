name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The local Workers runtime and npm should never prompt or phone home in CI.
  WRANGLER_SEND_METRICS: 'false'
  NO_UPDATE_NOTIFIER: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # The validation suite in three shards on separate runners, balanced on measured time
  # (tools/ci/weighted-sequencer.ts): every file runs in exactly one shard. One runner took
  # 14-15 minutes for the whole suite, against the 15-minute limit.
  physics-shard:
    name: physics shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:physics -- --shard=${{ matrix.shard }}/3

  # The required check: passes only when every shard passed (a failed, cancelled or skipped
  # shard fails it).
  physics:
    if: always()
    needs: physics-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every physics shard passed
        run: test "${{ needs.physics-shard.result }}" = success

  rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rooms

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Builds the client, then checks it against tools/budget/budget.config.json.
      - run: npm run build
      # Verifies the Cloudflare bundle (dry-run, limits, DO migrations) and local Workers runtime.
      - run: node tools/deploy/check.mjs && npm run test:deploy
      # The two longest browser scenarios (five-session leak test, context loss with a full
      # rebake) run here, on the build just made, in parallel with the browser job.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Install Chromium system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:browser:lifecycle
      # The phone menu sweep on WebKit, the engine of every iPhone browser (DOM only, quick).
      - name: Cache WebKit
        id: wk-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright/webkit-*
          key: playwright-webkit-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install WebKit
        if: steps.wk-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit
      - name: Install WebKit system libraries
        if: steps.wk-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit
      - run: npm run test:browser:webkit
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-lifecycle
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Keep the built client
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: web-client-${{ github.sha }}
          path: apps/web/dist
          retention-days: 30
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium
      # The system libraries (apt) and the client build do not depend on each other: run them
      # side by side. `wait` fails the step if the install failed.
      - name: Build, with Chromium system libraries installed alongside
        run: |
          deps=
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = 'true' ]; then
            npx playwright install-deps chromium &
            deps=$!
          fi
          npm run build
          if [ -n "$deps" ]; then wait "$deps"; fi
      - run: npm run test:browser:views
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the secret scan covers every commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Asset licence check
        run: npm run check:assets
      - name: Credits and dependency licence check
        run: npm run check:credits
      - name: Secret scan (gitleaks, checksum-verified release binary)
        run: npm run check:secrets
